meta:
  title: "MusicFree | 基于插件的安卓无广告音乐播放器"
  description: "使用 MusicFree，随心所欲体验音乐！这是一款基于插件、可自定义、100% 无广告的安卓音乐播放器。所有数据本地存储，尽享完全隐私。立即下载！"
  image: "https://placehold.co/1200x630?text=MusicFree"
sections:
  - sectionName: "Hero"
    sectionSummary: "一个充满活力和欢迎氛围的英雄区域，介绍了 MusicFree 的核心价值主张——一个免费、基于插件的音乐播放器——并提供了清晰的下载和源代码 CTA，配以生动的产品视觉图。"
    splitHeroTitle: "你的音乐，你做主。完全免费。"
    splitHeroDescription: "了解一下 MusicFree，这是一款基于插件的安卓无广告音乐播放器。您可以通过插件连接到任何在线音源、自定义您的体验，并享受无中断的音乐。您的所有数据都保留在设备上。"
    splitHeroActions:
      - text: "立即下载"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "在 GitHub 上查看"
        link: "https://github.com/maotoumao/MusicFree"
    splitHeroRightImage: "https://placehold.co/800x600?text=MusicFree+UI"
  - sectionName: "Features"
    sectionSummary: "一个动态网格，展示了 MusicFree 的六大优点。本节使用图标和简洁的文字快速传达应用的强大功能，从插件架构到隐私优先的方法，使其内容激动人心且易于理解。"
    threeColumnGridTitle: "你会爱上 MusicFree 的理由"
    list:
      - sectionName: "FeaturePluginPowered"
        sectionSummary: "突出核心的插件架构，让用户能够最终控制他们的音乐来源。"
        iconName: "lucide:plug-zap"
        cardTitle: "插件驱动的音乐体验"
        cardDescription: "MusicFree 只是一个播放器！音源由您决定。安装插件即可从网络上任意位置搜索、播放和导入音乐。"
      - sectionName: "FeatureCustomizable"
        sectionSummary: "展示应用的个性化选项，吸引喜欢定制体验的用户。"
        iconName: "lucide:palette"
        cardTitle: "你的风格，你定义"
        cardDescription: "在浅色和深色模式间切换，或设置自定义背景，让播放器真正属于您。一切由您的风格决定。"
      - sectionName: "FeatureAdFree"
        sectionSummary: "强调应用的无广告和开源特性，建立信任并突出一个关键的用户利益。"
        iconName: "lucide:shield-off"
        cardTitle: "无广告 & 开源"
        cardDescription: "享受不间断的聆听体验。MusicFree 完全免费、开源，并且永远不会有广告。"
      - sectionName: "FeaturePrivacy"
        sectionSummary: "关注隐私这一关键优势，向用户保证他们的数据保持本地化和安全。"
        iconName: "lucide:lock"
        cardTitle: "你的数据，归你所有"
        cardDescription: "您的所有数据、播放列表和设置都存储在您的本地设备上。我们不收集您的任何个人信息。"
      - sectionName: "FeatureLyrics"
        sectionSummary: "详细介绍独特的歌词关联功能，这是一个对音乐爱好者来说很酷且实用的工具。"
        iconName: "lucide:music-4"
        cardTitle: "歌词关联"
        cardDescription: "将一首歌的歌词关联到另一首歌。非常适合翻唱、混音，或者当您在别处找到更好的歌词时使用。"
      - sectionName: "FeatureDesktop"
        sectionSummary: "告知用户桌面版本，扩展应用的生态系统和实用性。"
        iconName: "lucide:laptop"
        cardTitle: "支持桌面版！"
        cardDescription: "喜欢手机上的 MusicFree 吗？在您的桌面上也能获得同样出色的体验。请在 GitHub 上查看 MusicFreeDesktop。"
  - sectionName: "HowToInstallPlugins"
    sectionSummary: "一个清晰、以行动为导向的区域，揭开了插件安装过程的神秘面纱。它提供了简单的解释和指向详细指南的直接链接，让新用户能够立即上手。"
    featureSectionTitle: "秒速上手"
    featureSectionDescription: "安装插件轻而易举。前往“设置”，点击“从网络安装插件”，然后粘贴插件仓库的 URL。即刻开始聆听！"
    featureSectionAction:
      text: "查看完整指南"
      link: "https://musicfree.catcat.work/usage/mobile/install-plugin.html"
    featureSectionBottomImage: "https://placehold.co/1440x700?text=Plugin+Installation+Screen"
  - sectionName: "AppScreenshots"
    sectionSummary: "一个视觉上引人入胜的 MusicFree UI 图库。本节使用两列网格来展示应用干净直观的设计，让潜在用户在下载前就能感受到应用的体验。"
    twoColumnGridTitle: "实际效果展示"
    list:
      - sectionName: "ScreenshotMain"
        sectionSummary: "展示主界面，突出其简洁的导航和用户友好的布局。"
        contentCardTitle: "简洁的主界面"
        contentCardDescription: "简洁直观的设计让您的音乐库一目了然，轻松浏览您的音乐。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Main+Interface"
      - sectionName: "ScreenshotPlayer"
        sectionSummary: "突出沉浸式的播放器视图，专注于音乐体验。"
        contentCardTitle: "沉浸式播放器"
        contentCardDescription: "精美的全屏播放器，风格化展示专辑封面，让您专注于音乐本身。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Player+Page"
      - sectionName: "ScreenshotLyrics"
        sectionSummary: "显示歌词页面，展示同步歌词功能。"
        contentCardTitle: "同步歌词"
        contentCardDescription: "跟着与歌曲同步滚动的歌词一起唱。再也不会错过任何一个节拍！"
        contentCardBottomImage: "https://placehold.co/800x450?text=Lyrics+Page"
      - sectionName: "ScreenshotPlaylist"
        sectionSummary: "显示播放列表管理屏幕，强调组织功能。"
        contentCardTitle: "井然有序的播放列表"
        contentCardDescription: "轻松管理您的播放列表，在其中搜索特定曲目，让您的音乐收藏保持整洁。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Playlist+Page"
  - sectionName: "Faq"
    sectionSummary: "一个有用的常见问题解答部分，主动回答了用户的常见问题。通过以易于阅读的折叠面板格式解决有关成本、音乐来源、安全性和平台支持的潜在疑虑，从而建立用户信心。"
    faqTitle: "常见问题"
    faqList:
      - question: "MusicFree 真的是免费的吗？"
        answer: "是的！这是一个开源项目，将永远免费且无广告。如果您看到付费版本，它们都是假的，请立即举报。"
      - question: "音乐从哪里来？"
        answer: "MusicFree 本身不提供任何音乐。所有歌曲都来自您选择安装的插件，这些插件会连接到互联网上的各种音源。"
      - question: "使用插件安全吗？"
        answer: "来自我们官方仓库的插件是安全的。如果您使用第三方插件，请自行验证其安全性。我们对恶意插件造成的问题概不负责。"
      - question: "我如何获取插件？"
        answer: "很简单！您可以直接在应用的设置中通过网络 URL 安装。我们提供了一个官方插件仓库帮助您快速上手。请访问我们的网站查看链接和分步指南！"
      - question: "支持哪些平台？"
        answer: "目前，MusicFree 适用于 Android 和 Harmony OS。我们还有一个独立的桌面版本在 GitHub 上供您试用！"
  - sectionName: "FinalCta"
    sectionSummary: "最后一个充满活力的行动号召，激励用户下载应用。它总结了核心优势，并提供了醒目的按钮，使下一步行动变得不可抗拒。"
    ctaTitle: "准备好掌控你的音乐了吗？"
    ctaDescription: "立即下载 MusicFree，体验真正开放、可定制、无广告的音乐播放器。加入社区，解放你的音乐！"
    cta:
      - text: "下载安卓版"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "在 GitHub 上探索"
        link: "https://github.com/maotoumao/MusicFree"