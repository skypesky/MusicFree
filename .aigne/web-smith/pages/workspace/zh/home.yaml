meta:
  title: "MusicFree | 基于插件、无广告的安卓音乐播放器"
  description: "使用 MusicFree，随心畅享音乐！这是一款由插件驱动、可自定义、100% 无广告的安卓音乐播放器。所有数据本地存储，全面保护您的隐私。立即下载！"
  image: "https://placehold.co/1200x630?text=MusicFree"
sections:
  - sectionName: "Hero"
    sectionSummary: "一个充满活力和欢迎氛围的英雄部分，介绍了 MusicFree 的核心价值主张——一个免费的、基于插件的音乐播放器——并提供了清晰的下载和源代码 CTA，配以生动的视觉产品图。"
    splitHeroTitle: "你的音乐，你做主。完全免费。"
    splitHeroDescription: "来认识一下 MusicFree，这款基于插件、无广告的安卓音乐播放器。自定义您的体验，通过插件连接到任何在线音源，不受干扰地享受您的音乐。您的所有数据都保留在您的设备上。"
    splitHeroActions:
      - text: "立即下载"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "在 GitHub 上查看"
        link: "https://github.com/maotoumao/MusicFree"
    splitHeroRightImage: "https://placehold.co/800x600?text=MusicFree+UI"
  - sectionName: "Features"
    sectionSummary: "一个动态网格，展示了 MusicFree 的六大优点。本节使用图标和简洁的文字，快速传达了该应用的强大功能，从其插件架构到隐私优先的方法，使其内容令人兴奋且易于理解。"
    threeColumnGridTitle: "为什么你会爱上 MusicFree"
    list:
      - sectionName: "FeaturePluginPowered"
        sectionSummary: "突出核心插件架构，让用户能够最终控制他们的音乐来源。"
        iconName: "lucide:plug-zap"
        cardTitle: "插件驱动的音乐体验"
        cardDescription: "MusicFree 只是一个播放器！音源由你决定。安装插件即可从网络上任何地方搜索、播放和导入音乐。"
      - sectionName: "FeatureCustomizable"
        sectionSummary: "展示应用的个性化选项，吸引喜欢定制体验的用户。"
        iconName: "lucide:palette"
        cardTitle: "你的风格，你定义"
        cardDescription: "在浅色和深色模式之间切换，或设置自定义背景，让播放器真正属于你。一切由你的风格决定。"
      - sectionName: "FeatureAdFree"
        sectionSummary: "强调应用的无广告和开源特性，建立信任并突出一个关键的用户利益。"
        iconName: "lucide:shield-off"
        cardTitle: "纯净无广告 & 开源"
        cardDescription: "享受不间断的聆听体验。MusicFree 完全免费、开源，并且永远不会有广告。"
      - sectionName: "FeaturePrivacy"
        sectionSummary: "关注隐私这一关键优势，向用户保证他们的数据保持本地化和安全。"
        iconName: "lucide:lock"
        cardTitle: "你的数据，归你所有"
        cardDescription: "您的所有数据、播放列表和设置都存储在您的本地设备上。我们不收集您的任何个人信息。"
      - sectionName: "FeatureLyrics"
        sectionSummary: "详细介绍独特的歌词关联功能，这是一个对音乐爱好者来说很酷且实用的工具。"
        iconName: "lucide:music-4"
        cardTitle: "歌词关联"
        cardDescription: "将一首歌的歌词链接到另一首歌。非常适合翻唱、混音，或者当你在别处找到更好的歌词时使用。"
      - sectionName: "FeatureDesktop"
        sectionSummary: "告知用户桌面版本，扩展了应用的生态系统和实用性。"
        iconName: "lucide:laptop"
        cardTitle: "桌面端同样可用！"
        cardDescription: "喜欢手机上的 MusicFree 吗？在您的桌面上也能获得同样出色的体验。快去 GitHub 上看看 MusicFreeDesktop 吧。"
  - sectionName: "HowToInstallPlugins"
    sectionSummary: "一个清晰、面向操作的章节，揭示了插件安装过程的神秘面纱。它提供了简单的解释和详细指南的直接链接，使新用户能够立即开始。"
    featureSectionTitle: "快速上手"
    featureSectionDescription: "安装插件轻而易举。前往“设置”，点击“从网络安装插件”，然后粘贴插件仓库的 URL。您很快就能开始听歌了！"
    featureSectionAction:
      text: "查看完整指南"
      link: "https://musicfree.catcat.work/usage/mobile/install-plugin.html"
    featureSectionBottomImage: "https://placehold.co/1440x700?text=Plugin+Installation+Screen"
  - sectionName: "AppScreenshots"
    sectionSummary: "一个视觉上引人入胜的 MusicFree UI 图库。本节使用两列网格来展示该应用干净直观的设计，让潜在用户在下载前就能感受到其体验。"
    twoColumnGridTitle: "一睹风采"
    list:
      - sectionName: "ScreenshotMain"
        sectionSummary: "展示主界面，突出其简洁的导航和用户友好的布局。"
        contentCardTitle: "简洁的主界面"
        contentCardDescription: "通过干净、直观的设计轻松浏览您的音乐，将您的音乐库置于最显眼的位置。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Main+Interface"
      - sectionName: "ScreenshotPlayer"
        sectionSummary: "突出沉浸式播放器视图，专注于音乐体验。"
        contentCardTitle: "沉浸式播放器"
        contentCardDescription: "通过精美的全屏播放器专注于音乐，以时尚的方式展示专辑封面。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Player+Page"
      - sectionName: "ScreenshotLyrics"
        sectionSummary: "显示歌词页面，以展示同步歌词功能。"
        contentCardTitle: "同步歌词"
        contentCardDescription: "跟着与歌曲播放完美同步滚动的歌词一起唱。再也不会错过任何一个节拍！"
        contentCardBottomImage: "https://placehold.co/800x450?text=Lyrics+Page"
      - sectionName: "ScreenshotPlaylist"
        sectionSummary: "显示播放列表管理屏幕，以强调组织功能。"
        contentCardTitle: "井然有序的播放列表"
        contentCardDescription: "轻松管理您的播放列表，在其中搜索特定曲目，并保持您的音乐收藏整洁有序。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Playlist+Page"
  - sectionName: "Faq"
    sectionSummary: "一个有用的常见问题解答部分，主动回答用户的常见问题。通过以易于阅读的折叠格式解决有关成本、音乐来源、安全性和平台支持的潜在问题来建立信心。"
    faqTitle: "常见问题"
    faqList:
      - question: "MusicFree 真的免费吗？"
        answer: "是的！它是一个开源项目，将永远免费且无广告。如果您看到付费版本，它们是假的，应立即举报。"
      - question: "音乐从哪里来？"
        answer: "MusicFree 本身不提供任何音乐。所有歌曲都来自您选择安装的插件，这些插件连接到互联网上的各种来源。"
      - question: "使用插件安全吗？"
        answer: "来自我们官方仓库的插件是安全的。如果您使用第三方插件，请自行验证其安全性。对于由恶意插件引起的问题，我们概不负责。"
      - question: "我如何获取插件？"
        answer: "很简单！您可以直接在应用的设置中通过网络 URL 安装它们。我们提供一个官方插件仓库供您开始使用。请访问我们的网站查看链接和分步指南！"
      - question: "支持哪些平台？"
        answer: "目前，MusicFree 适用于 Android 和 Harmony OS。我们还有一个单独的桌面版本在 GitHub 上供您试用！"
  - sectionName: "FinalCta"
    sectionSummary: "最后一个充满活力的行动号召，激励用户下载该应用。它总结了核心优势，并提供了醒目的按钮，使下一步行动变得不可抗拒。"
    ctaTitle: "准备好掌控你的音乐了吗？"
    ctaDescription: "立即下载 MusicFree，体验一个真正开放、可定制且无广告的音乐播放器。加入社区，解放你的音乐！"
    cta:
      - text: "下载安卓版"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "在 GitHub 上探索"
        link: "https://github.com/maotoumao/MusicFree"