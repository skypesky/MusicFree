  - "sectionName": "Faq"
    "sectionSummary": "一个实用的常见问题解答区域，主动回答了用户的常见问题。通过易于阅读的折叠面板格式，解决了关于费用、音乐来源、安全性和平台支持等潜在疑虑，从而建立用户信心。"
    "faqTitle": "常见问题"
    "faqList":
      - "question": "MusicFree 真的免费吗？"
        "answer": "是的！这是一个开源项目，将永远免费且无广告。如果你看到付费版本，它们都是假的，请立即举报。"
      - "question": "音乐从哪里来？"
        "answer": "MusicFree 本身不提供任何音乐。所有歌曲都来自你选择安装的插件，这些插件会连接到互联网上的各种音源。"
      - "question": "使用插件安全吗？"
        "answer": "来自我们官方仓库的插件是安全的。如果你使用第三方插件，请自行验证其安全性。对于恶意插件造成的问题，我们概不负责。"
      - "question": "我如何获取插件？"
        "answer": "很简单！你可以直接在应用的设置中通过网络 URL 安装。我们提供了一个官方插件仓库帮助你入门。请访问我们的网站查看链接和分步指南！"
      - "question": "支持哪些平台？"
        "answer": "目前，MusicFree 适用于安卓和鸿蒙操作系统。我们还有一个独立的桌面版在 GitHub 上可供试用！"
