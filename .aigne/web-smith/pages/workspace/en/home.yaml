meta:
  title: "MusicFree | Plugin-Based, Ad-Free Music Player for Android"
  description: "Experience music your way with MusicFree! A plugin-powered, customizable, and 100% ad-free music player for Android. Enjoy total privacy with local data storage. Download now!"
  image: "https://placehold.co/1200x630?text=MusicFree"
sections:
  - sectionName: "Hero"
    sectionSummary: "An energetic and welcoming hero section that introduces MusicFree's core value proposition—a free, plugin-based music player—with clear download and source code CTAs, paired with a vibrant product visual."
    splitHeroTitle: "Your Music, Your Rules. Totally Free."
    splitHeroDescription: "Meet MusicFree, the plugin-based, ad-free music player for Android. Customize your experience, connect to any online source with plugins, and enjoy your tunes without interruptions. All your data stays on your device."
    splitHeroActions:
      - text: "Download Now"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "View on GitHub"
        link: "https://github.com/maotoumao/MusicFree"
    splitHeroRightImage: "https://placehold.co/800x600?text=MusicFree+UI"
  - sectionName: "Features"
    sectionSummary: "A dynamic grid showcasing the top six benefits of MusicFree. This section uses icons and concise text to quickly communicate the app's power, from its plugin architecture to its privacy-first approach, making it exciting and easy to digest."
    threeColumnGridTitle: "Why You'll Love MusicFree"
    list:
      - sectionName: "FeaturePluginPowered"
        sectionSummary: "Highlighting the core plugin architecture that gives users ultimate control over their music sources."
        iconName: "lucide:plug-zap"
        cardTitle: "Plugin-Powered Music"
        cardDescription: "MusicFree is just a player! You decide the source. Install plugins to search, play, and import from anywhere on the web."
      - sectionName: "FeatureCustomizable"
        sectionSummary: "Showcasing the app's personalization options, appealing to users who love to tailor their experience."
        iconName: "lucide:palette"
        cardTitle: "Your Vibe, Your Look"
        cardDescription: "Switch between light and dark modes, or set a custom background to make the player truly yours. It’s all about your style."
      - sectionName: "FeatureAdFree"
        sectionSummary: "Emphasizing the ad-free and open-source nature of the app, building trust and highlighting a key user benefit."
        iconName: "lucide:shield-off"
        cardTitle: "Ad-Free & Open Source"
        cardDescription: "Enjoy an uninterrupted listening experience. MusicFree is completely free, open source, and will never have ads. Period."
      - sectionName: "FeaturePrivacy"
        sectionSummary: "Focusing on the crucial benefit of privacy, assuring users that their data remains local and secure."
        iconName: "lucide:lock"
        cardTitle: "Your Data is Yours"
        cardDescription: "All your data, playlists, and settings are stored locally on your device. We don't collect any of your personal information."
      - sectionName: "FeatureLyrics"
        sectionSummary: "Detailing the unique lyrics association feature, a cool and practical tool for music lovers."
        iconName: "lucide:music-4"
        cardTitle: "Lyrics Association"
        cardDescription: "Link lyrics from one song to another. Perfect for covers, remixes, or when you just find better lyrics elsewhere."
      - sectionName: "FeatureDesktop"
        sectionSummary: "Informing users about the desktop version, expanding the app's ecosystem and utility."
        iconName: "lucide:laptop"
        cardTitle: "Also on Desktop!"
        cardDescription: "Love MusicFree on your phone? Get the same great experience on your desktop. Check out MusicFreeDesktop on GitHub."
  - sectionName: "HowToInstallPlugins"
    sectionSummary: "A clear, action-oriented section that demystifies the plugin installation process. It provides a simple explanation and a direct link to a detailed guide, empowering new users to get started immediately."
    featureSectionTitle: "Get Started in Seconds"
    featureSectionDescription: "Installing plugins is a breeze. Head to Settings, tap 'Install plugin from network', and paste the plugin repository URL. You'll be listening in no time!"
    featureSectionAction:
      text: "See the Full Guide"
      link: "https://musicfree.catcat.work/usage/mobile/install-plugin.html"
    featureSectionBottomImage: "https://placehold.co/1440x700?text=Plugin+Installation+Screen"
  - sectionName: "AppScreenshots"
    sectionSummary: "A visually engaging gallery of the MusicFree UI. This section uses a two-column grid to show off the app's clean and intuitive design, giving potential users a feel for the experience before they download."
    twoColumnGridTitle: "See It In Action"
    list:
      - sectionName: "ScreenshotMain"
        sectionSummary: "Showcasing the main interface to highlight its clean navigation and user-friendly layout."
        contentCardTitle: "Sleek Main Interface"
        contentCardDescription: "Navigate your music effortlessly with a clean, intuitive design that puts your library front and center."
        contentCardBottomImage: "https://placehold.co/800x450?text=Main+Interface"
      - sectionName: "ScreenshotPlayer"
        sectionSummary: "Highlighting the immersive player view, focusing on the music experience."
        contentCardTitle: "Immersive Player"
        contentCardDescription: "Focus on the music with a beautiful, full-screen player that showcases album art in style."
        contentCardBottomImage: "https://placehold.co/800x450?text=Player+Page"
      - sectionName: "ScreenshotLyrics"
        sectionSummary: "Displaying the lyrics page to demonstrate the synchronized lyrics feature."
        contentCardTitle: "Synced Lyrics"
        contentCardDescription: "Sing along with perfectly timed lyrics that scroll as the song plays. Never miss a beat!"
        contentCardBottomImage: "https://placehold.co/800x450?text=Lyrics+Page"
      - sectionName: "ScreenshotPlaylist"
        sectionSummary: "Showing the playlist management screen to emphasize organizational features."
        contentCardTitle: "Organized Playlists"
        contentCardDescription: "Easily manage your playlists, search for specific tracks within them, and keep your music collection tidy."
        contentCardBottomImage: "https://placehold.co/800x450?text=Playlist+Page"
  - sectionName: "Faq"
    sectionSummary: "A helpful FAQ section that proactively answers common user questions. This builds confidence by addressing potential concerns about cost, music sources, safety, and platform support in an easy-to-read accordion format."
    faqTitle: "Frequently Asked Questions"
    faqList:
      - question: "Is MusicFree really free?"
        answer: "Yes! It's an open-source project and will always be free and ad-free. If you see paid versions, they are fake and should be reported immediately."
      - question: "Where does the music come from?"
        answer: "MusicFree itself doesn't provide any music. All songs come from the plugins you choose to install, which connect to various sources on the internet."
      - question: "Are plugins safe to use?"
        answer: "Plugins from our official repository are safe. If you use third-party plugins, please verify their security yourself. We are not responsible for issues caused by malicious plugins."
      - question: "How do I get plugins?"
        answer: "It's easy! You can install them from a network URL directly in the app's settings. We provide an official plugin repository to get you started. Check our website for the link and a step-by-step guide!"
      - question: "What platforms are supported?"
        answer: "Currently, MusicFree is available for Android and Harmony OS. We also have a separate desktop version available on GitHub for you to try!"
  - sectionName: "FinalCta"
    sectionSummary: "A final, high-energy call-to-action that motivates users to download the app. It summarizes the core benefits and provides prominent buttons to make the next step irresistible."
    ctaTitle: "Ready to Take Control of Your Music?"
    ctaDescription: "Download MusicFree now and experience a truly open, customizable, and ad-free music player. Join the community and set your music free!"
    cta:
      - text: "Download for Android"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "Explore on GitHub"
        link: "https://github.com/maotoumao/MusicFree"