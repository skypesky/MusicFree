meta:
  title: "MusicFree | プラグイン対応・広告なしのAndroid向け音楽プレイヤー"
  description: "MusicFreeで音楽を思いのままに！プラグイン対応、カスタマイズ可能、そして100%広告なしのAndroid向け音楽プレイヤー。データはローカルに保存され、プライバシーも万全です。今すぐダウンロード！"
  image: "https://placehold.co/1200x630?text=MusicFree"
sections:
  - sectionName: "Hero"
    sectionSummary: "MusicFreeの核心的価値（無料でプラグインベースの音楽プレイヤー）を提示し、ダウンロードとソースコードへの明確なCTAを配置した、エネルギッシュで魅力的なヒーローセクション。鮮やかな製品ビジュアルも特徴です。"
    splitHeroTitle: "あなたの音楽を、あなたのルールで。完全無料。"
    splitHeroDescription: "Android向けプラグイン対応・広告なしの音楽プレイヤー、MusicFreeをご紹介します。プラグインでオンライン上のあらゆる音源に接続し、あなただけの体験をカスタマイズ。中断されることなく音楽を楽しめます。あなたのデータはすべて、お使いのデバイス上に保存されます。"
    splitHeroActions:
      - text: "今すぐダウンロード"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "GitHubで見る"
        link: "https://github.com/maotoumao/MusicFree"
    splitHeroRightImage: "https://placehold.co/800x600?text=MusicFree+UI"
  - sectionName: "Features"
    sectionSummary: "MusicFreeの6つの主な利点をダイナミックなグリッドで紹介するセクション。プラグインアーキテクチャからプライバシー第一のアプローチまで、アイコンと簡潔なテキストでアプリの強力な機能を素早く伝え、魅力的で理解しやすい構成になっています。"
    threeColumnGridTitle: "MusicFreeの魅力"
    list:
      - sectionName: "FeaturePluginPowered"
        sectionSummary: "ユーザーが音楽ソースを完全にコントロールできる、中核となるプラグインアーキテクチャを強調します。"
        iconName: "lucide:plug-zap"
        cardTitle: "プラグインで広がる音楽体験"
        cardDescription: "MusicFreeは単なるプレイヤーです！音源はあなたが決めます。プラグインをインストールして、ウェブ上のあらゆる場所から検索、再生、インポートが可能です。"
      - sectionName: "FeatureCustomizable"
        sectionSummary: "アプリのパーソナライズオプションを紹介し、自分好みの体験を求めるユーザーにアピールします。"
        iconName: "lucide:palette"
        cardTitle: "あなた好みのデザインに"
        cardDescription: "ライトモードとダークモードを切り替えたり、カスタム背景を設定したりして、プレイヤーをあなただけのものに。すべてはあなたのスタイル次第です。"
      - sectionName: "FeatureAdFree"
        sectionSummary: "広告なしでオープンソースであることを強調し、信頼を築き、ユーザーにとっての主要な利点をアピールします。"
        iconName: "lucide:shield-off"
        cardTitle: "広告なし＆オープンソース"
        cardDescription: "中断されることのないリスニング体験をお楽しみください。MusicFreeは完全に無料でオープンソースであり、今後も広告は一切表示されません。"
      - sectionName: "FeaturePrivacy"
        sectionSummary: "プライバシーという重要な利点に焦点を当て、ユーザーデータがローカルで安全に保たれることを保証します。"
        iconName: "lucide:lock"
        cardTitle: "あなたのデータはあなたのもの"
        cardDescription: "プレイリストや設定など、すべてのデータはお使いのデバイスのローカルに保存されます。私たちはあなたの個人情報を一切収集しません。"
      - sectionName: "FeatureLyrics"
        sectionSummary: "音楽愛好家にとって便利でユニークなツールである、歌詞の関連付け機能について詳しく説明します。"
        iconName: "lucide:music-4"
        cardTitle: "歌詞の関連付け機能"
        cardDescription: "ある曲の歌詞を別の曲にリンクできます。カバー曲やリミックス、または他の場所でより良い歌詞を見つけた場合に最適です。"
      - sectionName: "FeatureDesktop"
        sectionSummary: "デスクトップ版についてユーザーに知らせ、アプリのエコシステムと有用性を拡大します。"
        iconName: "lucide:laptop"
        cardTitle: "デスクトップ版もあります！"
        cardDescription: "スマホのMusicFreeが気に入りましたか？デスクトップでも同じ素晴らしい体験を。GitHubでMusicFreeDesktopをチェックしてください。"
  - sectionName: "HowToInstallPlugins"
    sectionSummary: "プラグインのインストールプロセスを分かりやすく説明する、明確で行動指向のセクション。簡単な説明と詳細ガイドへの直接リンクを提供し、新規ユーザーがすぐに始められるようにします。"
    featureSectionTitle: "数秒でセットアップ完了"
    featureSectionDescription: "プラグインのインストールは簡単です。「設定」に移動し、「ネットワークからプラグインをインストール」をタップして、プラグインリポジトリのURLを貼り付けます。すぐに音楽を聴き始められます！"
    featureSectionAction:
      text: "完全ガイドを見る"
      link: "https://musicfree.catcat.work/usage/mobile/install-plugin.html"
    featureSectionBottomImage: "https://placehold.co/1440x700?text=Plugin+Installation+Screen"
  - sectionName: "AppScreenshots"
    sectionSummary: "MusicFreeのUIを視覚的に紹介するギャラリーセクション。2カラムのグリッドを使用してアプリのクリーンで直感的なデザインを披露し、潜在的なユーザーがダウンロード前にその体験をイメージできるようにします。"
    twoColumnGridTitle: "実際の動作を見てみよう"
    list:
      - sectionName: "ScreenshotMain"
        sectionSummary: "クリーンなナビゲーションとユーザーフレンドリーなレイアウトを強調するため、メインインターフェースを紹介します。"
        contentCardTitle: "洗練されたメインインターフェース"
        contentCardDescription: "ライブラリが中心に配置された、クリーンで直感的なデザインで、音楽を簡単に操作できます。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Main+Interface"
      - sectionName: "ScreenshotPlayer"
        sectionSummary: "音楽体験に焦点を当て、没入感のあるプレイヤービューを強調します。"
        contentCardTitle: "没入感のあるプレイヤー"
        contentCardDescription: "アルバムアートを美しく表示するフルスクリーンプレイヤーで、音楽に集中できます。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Player+Page"
      - sectionName: "ScreenshotLyrics"
        sectionSummary: "同期された歌詞機能を示すために、歌詞ページを表示します。"
        contentCardTitle: "同期された歌詞"
        contentCardDescription: "曲の再生に合わせてスクロールする、タイミングが完璧な歌詞と一緒に歌いましょう。もうビートを逃しません！"
        contentCardBottomImage: "https://placehold.co/800x450?text=Lyrics+Page"
      - sectionName: "ScreenshotPlaylist"
        sectionSummary: "整理機能を強調するために、プレイリスト管理画面を表示します。"
        contentCardTitle: "整理されたプレイリスト"
        contentCardDescription: "プレイリストの管理や特定の曲の検索が簡単に行え、音楽コレクションを常に整理できます。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Playlist+Page"
  - sectionName: "Faq"
    sectionSummary: "ユーザーの一般的な質問に積極的に答える、役立つFAQセクション。費用、音楽ソース、安全性、プラットフォームサポートに関する潜在的な懸念に、読みやすいアコーディオン形式で対応し、信頼を築きます。"
    faqTitle: "よくある質問"
    faqList:
      - question: "MusicFreeは本当に無料ですか？"
        answer: "はい！これはオープンソースプロジェクトであり、常に無料で広告もありません。もし有料版を見かけた場合、それらは偽物ですので、直ちに報告してください。"
      - question: "音楽はどこから提供されるのですか？"
        answer: "MusicFree自体は音楽を提供していません。すべての曲は、あなたがインストールを選択したプラグインから提供されます。これらのプラグインは、インターネット上の様々なソースに接続します。"
      - question: "プラグインは安全に使用できますか？"
        answer: "公式リポジトリのプラグインは安全です。サードパーティのプラグインを使用する場合は、ご自身でその安全性を確認してください。悪意のあるプラグインによって引き起こされた問題について、私たちは責任を負いません。"
      - question: "どうすればプラグインを入手できますか？"
        answer: "簡単です！アプリの設定からネットワークURLを直接指定してインストールできます。すぐに始められるように、公式のプラグインリポジトリも提供しています。リンクと手順については、私たちのウェブサイトを確認してください！"
      - question: "どのプラットフォームがサポートされていますか？"
        answer: "現在、MusicFreeはAndroidとHarmony OSで利用可能です。また、GitHubでは別のデスクトップ版も試すことができます！"
  - sectionName: "FinalCta"
    sectionSummary: "ユーザーにアプリのダウンロードを促す、最後の力強いコールトゥアクション。主要な利点を要約し、次のステップに進みたくなるような目立つボタンを提供します。"
    ctaTitle: "さあ、あなたの音楽を思い通りにコントロールしませんか？"
    ctaDescription: "今すぐMusicFreeをダウンロードして、真にオープンで、カスタマイズ可能で、広告のない音楽プレイヤーを体験してください。コミュニティに参加して、あなたの音楽を解放しましょう！"
    cta:
      - text: "Android版をダウンロード"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "GitHubで探す"
        link: "https://github.com/maotoumao/MusicFree"