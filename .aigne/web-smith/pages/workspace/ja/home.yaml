"meta":
  "title": "MusicFree | プラグイン対応・広告なしのAndroid向け音楽プレイヤー"
  "description": "MusicFreeで音楽を思いのままに体験！プラグイン対応でカスタマイズ可能、100%広告なしのAndroid向け音楽プレイヤー。データはローカルに保存され、プライバシーも万全です。今すぐダウンロード！"
  "image": "https://placehold.co/1200x630?text=MusicFree"
"sections":
  - "sectionName": "Hero"
    "sectionSummary": "MusicFreeの核となる価値提案（無料のプラグインベース音楽プレイヤー）を紹介する、エネルギッシュで歓迎的なヒーローセクション。明確なダウンロードとソースコードへのCTA、そして鮮やかな製品ビジュアルを組み合わせています。"
    "splitHeroTitle": "あなたの音楽を、あなたのルールで。完全無料。"
    "splitHeroDescription": "Android向けプラグイン対応・広告なしの音楽プレイヤー、MusicFreeをご紹介します。プラグインで様々なオンラインソースに接続し、あなただけの体験にカスタマイズ。中断されることなく音楽を楽しめます。データはすべてあなたのデバイスに保存されます。"
    "splitHeroActions":
      - "text": "今すぐダウンロード"
        "link": "https://github.com/maotoumao/MusicFree/releases"
      - "text": "GitHubで見る"
        "link": "https://github.com/maotoumao/MusicFree"
    "splitHeroRightImage": "mediakit://main-v0.6.jpg"
  - "sectionName": "Features"
    "sectionSummary": "MusicFreeの6つの主な利点を紹介するダイナミックなグリッド。このセクションでは、アイコンと簡潔なテキストを用いて、プラグインアーキテクチャからプライバシー第一のアプローチまで、アプリのパワーを迅速に伝え、魅力的で理解しやすくしています。"
    "threeColumnGridTitle": "MusicFreeの魅力"
    "list":
      - "sectionName": "FeaturePluginPowered"
        "sectionSummary": "ユーザーが音楽ソースを完全にコントロールできる、中核となるプラグインアーキテクチャを強調します。"
        "iconName": "lucide:plug-zap"
        "cardTitle": "プラグインで広がる音楽体験"
        "cardDescription": "MusicFreeは単なるプレイヤーです。音楽ソースはあなたが決めます。プラグインをインストールすれば、ウェブ上のあらゆる場所から検索、再生、インポートが可能です。"
      - "sectionName": "FeatureCustomizable"
        "sectionSummary": "体験をカスタマイズするのが好きなユーザーにアピールする、アプリのパーソナライゼーションオプションを紹介します。"
        "iconName": "lucide:palette"
        "cardTitle": "あなた好みのデザインに"
        "cardDescription": "ライトモードとダークモードを切り替えたり、カスタム背景を設定したりして、プレイヤーをあなただけのものに。すべてはあなたのスタイル次第です。"
      - "sectionName": "FeatureAdFree"
        "sectionSummary": "アプリが広告なしでオープンソースであることを強調し、信頼を築き、ユーザーの主要な利点を際立たせます。"
        "iconName": "lucide:shield-off"
        "cardTitle": "広告なし・オープンソース"
        "cardDescription": "中断されることのないリスニング体験をお楽しみください。MusicFreeは完全無料でオープンソースであり、今後も広告は一切表示されません。"
      - "sectionName": "FeaturePrivacy"
        "sectionSummary": "プライバシーという重要な利点に焦点を当て、ユーザーのデータがローカルに安全に保たれることを保証します。"
        "iconName": "lucide:lock"
        "cardTitle": "あなたのデータはあなたのもの"
        "cardDescription": "あなたのデータ、プレイリスト、設定はすべてお使いのデバイスにローカル保存されます。私たちはあなたの個人情報を一切収集しません。"
      - "sectionName": "FeatureLyrics"
        "sectionSummary": "音楽愛好家にとってクールで実用的なツールである、ユニークな歌詞関連付け機能について詳述します。"
        "iconName": "lucide:music-4"
        "cardTitle": "歌詞の関連付け機能"
        "cardDescription": "ある曲の歌詞を別の曲にリンクできます。カバー曲やリミックス、または他でより良い歌詞を見つけた場合に最適です。"
      - "sectionName": "FeatureDesktop"
        "sectionSummary": "デスクトップ版についてユーザーに知らせ、アプリのエコシステムと実用性を拡大します。"
        "iconName": "lucide:laptop"
        "cardTitle": "デスクトップ版も利用可能！"
        "cardDescription": "スマホのMusicFreeが気に入りましたか？デスクトップでも同じ素晴らしい体験を。GitHubでMusicFreeDesktopをチェックしてみてください。"
  - "sectionName": "HowToInstallPlugins"
    "sectionSummary": "プラグインのインストールプロセスを分かりやすく説明する、明確で行動指向のセクション。簡単な説明と詳細ガイドへの直接リンクを提供し、新規ユーザーがすぐに始められるようにします。"
    "featureSectionTitle": "すぐに始めよう"
    "featureSectionDescription": "プラグインのインストールは簡単です。「設定」に移動し、「ネットワークからプラグインをインストール」をタップして、プラグインリポジトリのURLを貼り付けるだけ。すぐに音楽を聴き始められます！"
    "featureSectionAction":
      "text": "詳細ガイドを見る"
      "link": "https://musicfree.catcat.work/usage/mobile/install-plugin.html"
    "featureSectionBottomImage": "mediakit://sidebar-v0.6.jpg"
  - "sectionName": "AppScreenshots"
    "sectionSummary": "MusicFreeのUIを視覚的に魅力的に見せるギャラリー。このセクションでは2列グリッドを使用し、アプリのクリーンで直感的なデザインを披露し、潜在的なユーザーがダウンロード前にその体験を感じられるようにします。"
    "twoColumnGridTitle": "実際の動作画面"
    "list":
      - "sectionName": "ScreenshotMain"
        "sectionSummary": "クリーンなナビゲーションとユーザーフレンドリーなレイアウトを強調するために、メインインターフェースを紹介します。"
        "contentCardTitle": "洗練されたメイン画面"
        "contentCardDescription": "ライブラリを中心にした、クリーンで直感的なデザインで、音楽を簡単に操作できます。"
        "contentCardBottomImage": "mediakit://main-v0.6.jpg"
      - "sectionName": "ScreenshotPlayer"
        "sectionSummary": "音楽体験に焦点を当て、没入感のあるプレイヤービューを強調します。"
        "contentCardTitle": "没入感のあるプレイヤー"
        "contentCardDescription": "アルバムアートをスタイリッシュに表示する、美しいフルスクリーンプレイヤーで音楽に集中できます。"
        "contentCardBottomImage": "mediakit://song-cover-v0.6.jpg"
      - "sectionName": "ScreenshotLyrics"
        "sectionSummary": "同期歌詞機能を示すために歌詞ページを表示します。"
        "contentCardTitle": "同期歌詞"
        "contentCardDescription": "曲の再生に合わせてスクロールする、タイミングぴったりの歌詞と一緒に歌いましょう。もうビートを逃しません！"
        "contentCardBottomImage": "mediakit://song-lrc-v0.6.jpg"
      - "sectionName": "ScreenshotPlaylist"
        "sectionSummary": "整理機能を強調するために、プレイリスト管理画面を表示します。"
        "contentCardTitle": "整理されたプレイリスト"
        "contentCardDescription": "プレイリストを簡単に管理し、その中から特定のトラックを検索して、音楽コレクションを整理整頓できます。"
        "contentCardBottomImage": "mediakit://song-sheet-v0.6.jpg"
  - "sectionName": "Faq"
    "sectionSummary": "一般的なユーザーの質問に積極的に答える、役立つFAQセクション。コスト、音楽ソース、安全性、プラットフォームサポートに関する潜在的な懸念に、読みやすいアコーディオン形式で対応することで、信頼を築きます。"
    "faqTitle": "よくある質問"
    "faqList":
      - "question": "MusicFreeは本当に無料ですか？"
        "answer": "はい！これはオープンソースプロジェクトであり、常に無料で広告もありません。有料版を見かけた場合、それらは偽物ですので、直ちに通報してください。"
      - "question": "音楽はどこから提供されるのですか？"
        "answer": "MusicFree自体は音楽を提供しません。すべての曲は、あなたがインストールを選択したプラグインから提供されます。プラグインはインターネット上の様々なソースに接続します。"
      - "question": "プラグインは安全に使用できますか？"
        "answer": "公式リポジトリのプラグインは安全です。サードパーティ製のプラグインを使用する場合は、ご自身でその安全性を確認してください。悪意のあるプラグインによって引き起こされた問題について、私たちは責任を負いません。"
      - "question": "プラグインはどうやって入手できますか？"
        "answer": "簡単です！アプリの設定からネットワークURLを直接指定してインストールできます。すぐに始められるように、公式のプラグインリポジトリも提供しています。リンクと手順ガイドについては、私たちのウェブサイトをご確認ください！"
      - "question": "どのプラットフォームに対応していますか？"
        "answer": "現在、MusicFreeはAndroidとHarmony OSで利用可能です。また、GitHubには別途デスクトップ版も用意していますので、ぜひお試しください！"
  - "sectionName": "FinalCta"
    "sectionSummary": "ユーザーにアプリのダウンロードを促す、最後の力強いコールトゥアクション。主要な利点を要約し、次のステップに進みたくなるような目立つボタンを提供します。"
    "ctaTitle": "さあ、あなたの音楽を取り戻そう"
    "ctaDescription": "今すぐMusicFreeをダウンロードして、真にオープンでカスタマイズ可能な広告なしの音楽プレイヤーを体験してください。コミュニティに参加して、あなたの音楽を解放しましょう！"
    "cta":
      - "text": "Android版をダウンロード"
        "link": "https://github.com/maotoumao/MusicFree/releases"
      - "text": "GitHubで詳しく見る"
        "link": "https://github.com/maotoumao/MusicFree"