  - "sectionName": "Features"
    "sectionSummary": "一個動態網格，展示 MusicFree 的六大優點。此區塊使用圖示和簡潔的文字，快速傳達應用程式的強大功能，從其外掛架構到隱私優先的設計，使其引人入勝且易於理解。"
    "threeColumnGridTitle": "您會愛上 MusicFree 的理由"
    "list":
      - "sectionName": "FeaturePluginPowered"
        "sectionSummary": "突顯核心的外掛架構，讓使用者能完全掌控他們的音樂來源。"
        "iconName": "lucide:plug-zap"
        "cardTitle": "由外掛驅動的音樂"
        "cardDescription": "MusicFree 只是一個播放器！由您決定來源。安裝外掛即可從網路上的任何地方搜尋、播放和匯入音樂。"
      - "sectionName": "FeatureCustomizable"
        "sectionSummary": "展示應用程式的個人化選項，吸引喜歡量身打造體驗的使用者。"
        "iconName": "lucide:palette"
        "cardTitle": "你的風格，你的外觀"
        "cardDescription": "在淺色和深色模式之間切換，或設定自訂背景，讓播放器真正屬於您。一切由您的風格決定。"
      - "sectionName": "FeatureAdFree"
        "sectionSummary": "強調應用程式無廣告和開源的特性，建立信任並突顯關鍵的使用者利益。"
        "iconName": "lucide:shield-off"
        "cardTitle": "無廣告 & 開源"
        "cardDescription": "享受不間斷的聆聽體驗。MusicFree 完全免費、開源，且永遠不會有廣告。絕不改變。"
      - "sectionName": "FeaturePrivacy"
        "sectionSummary": "著重於隱私的關鍵優點，向使用者保證他們的資料會保留在本機且安全無虞。"
        "iconName": "lucide:lock"
        "cardTitle": "您的資料，由您掌握"
        "cardDescription": "您的所有資料、播放清單和設定都儲存在您的裝置本機。我們不收集任何您的個人資訊。"
      - "sectionName": "FeatureLyrics"
        "sectionSummary": "詳細介紹獨特的歌詞關聯功能，這對音樂愛好者來說是一個酷炫又實用的工具。"
        "iconName": "lucide:music-4"
        "cardTitle": "歌詞關聯"
        "cardDescription": "將一首歌的歌詞連結到另一首歌。非常適合翻唱、混音，或當您在別處找到更好的歌詞時使用。"
      - "sectionName": "FeatureDesktop"
        "sectionSummary": "告知使用者有關桌面版的資訊，擴展應用程式的生態系統和實用性。"
        "iconName": "lucide:laptop"
        "cardTitle": "也有桌面版！"
        "cardDescription": "喜歡手機上的 MusicFree 嗎？在您的桌機上也能獲得同樣出色的體驗。到 GitHub 上查看 MusicFreeDesktop。"
  - "sectionName": "HowToInstallPlugins"
    "sectionSummary": "一個清晰、以行動為導向的區塊，旨在揭開外掛安裝過程的神秘面紗。它提供了簡單的說明和詳細指南的直接連結，讓新使用者能立即上手。"
    "featureSectionTitle": "數秒內即可開始"
    "featureSectionDescription": "安裝外掛輕而易舉。前往「設定」，點擊「從網路安裝外掛」，然後貼上外掛儲存庫的 URL。您馬上就能開始聽音樂了！"
    "featureSectionAction":
      "text": "查看完整指南"
