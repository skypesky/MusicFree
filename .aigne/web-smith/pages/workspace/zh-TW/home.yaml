        "contentCardBottomImage": "mediakit://song-sheet-v0.6.jpg"
  - "sectionName": "Faq"
    "sectionSummary": "一個實用的常見問答區塊，主動回答使用者常見問題。透過易於閱讀的摺疊選單格式，解決關於費用、音樂來源、安全性及平台支援等潛在疑慮，藉此建立使用者信心。"
    "faqTitle": "常見問答"
    "faqList":
      - "question": "MusicFree 真的免費嗎？"
        "answer": "是的！這是一個開源專案，並且將永遠免費且無廣告。如果您看到付費版本，它們是假的，應立即回報。"
      - "question": "音樂從哪裡來？"
        "answer": "MusicFree 本身不提供任何音樂。所有歌曲都來自您選擇安裝的外掛，這些外掛會連接到網際網路上的各種來源。"
      - "question": "使用外掛安全嗎？"
        "answer": "來自我們官方儲存庫的外掛是安全的。如果您使用第三方外掛，請自行驗證其安全性。我們對惡意外掛造成的問題概不負責。"
      - "question": "如何取得外掛？"
        "answer": "很簡單！您可以直接在應用程式的設定中，透過網路 URL 進行安裝。我們提供了一個官方外掛儲存庫幫助您入門。請查看我們的網站以獲取連結和逐步指南！"
      - "question": "支援哪些平台？"
        "answer": "目前，MusicFree 適用於 Android 和 Harmony OS。我們還有一個獨立的桌面版本在 GitHub 上供您試用！"
