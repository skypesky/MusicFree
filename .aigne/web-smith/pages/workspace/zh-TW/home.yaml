    "splitHeroTitle": "你的音樂，你的規則。完全免費。"
    "splitHeroDescription": "認識 MusicFree，這款基於外掛、無廣告的 Android 音樂播放器。自訂您的體驗，透過外掛連接任何線上來源，不受干擾地享受您的音樂。您的所有資料都儲存在您的裝置上。"
