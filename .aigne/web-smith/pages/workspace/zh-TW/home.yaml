meta:
  title: "MusicFree | 基於插件、無廣告的 Android 音樂播放器"
  description: "使用 MusicFree，以您的方式體驗音樂！一款由插件驅動、可自訂且 100% 無廣告的 Android 音樂播放器。透過本機資料儲存，享受完全的隱私。立即下載！"
  image: "https://placehold.co/1200x630?text=MusicFree"
sections:
  - sectionName: "Hero"
    sectionSummary: "一個充滿活力且熱情的英雄區塊，介紹 MusicFree 的核心價值主張——一個免費、基於插件的音樂播放器——並提供清晰的下載和原始碼 CTA，搭配生動的產品視覺圖。"
    splitHeroTitle: "你的音樂，你的規則。完全免費。"
    splitHeroDescription: "認識 MusicFree，這款基於插件、無廣告的 Android 音樂播放器。自訂您的體驗，透過插件連接到任何線上來源，不受干擾地享受您的音樂。您的所有資料都儲存在您的裝置上。"
    splitHeroActions:
      - text: "立即下載"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "在 GitHub 上查看"
        link: "https://github.com/maotoumao/MusicFree"
    splitHeroRightImage: "https://placehold.co/800x600?text=MusicFree+UI"
  - sectionName: "Features"
    sectionSummary: "一個動態網格，展示 MusicFree 的六大優點。本區塊使用圖示和簡潔的文字，快速傳達應用程式的強大功能，從其插件架構到隱私優先的設計，使其既吸引人又易於理解。"
    threeColumnGridTitle: "您會愛上 MusicFree 的理由"
    list:
      - sectionName: "FeaturePluginPowered"
        sectionSummary: "強調核心的插件架構，讓使用者能完全控制他們的音樂來源。"
        iconName: "lucide:plug-zap"
        cardTitle: "插件驅動的音樂"
        cardDescription: "MusicFree 只是一個播放器！由您決定來源。安裝插件即可從網路上任何地方搜尋、播放和匯入。"
      - sectionName: "FeatureCustomizable"
        sectionSummary: "展示應用程式的個人化選項，吸引喜歡自訂體驗的使用者。"
        iconName: "lucide:palette"
        cardTitle: "你的風格，你的外觀"
        cardDescription: "在淺色和深色模式之間切換，或設定自訂背景，讓播放器真正屬於您。一切由您的風格決定。"
      - sectionName: "FeatureAdFree"
        sectionSummary: "強調應用程式無廣告和開源的特性，建立信任並突顯關鍵的使用者利益。"
        iconName: "lucide:shield-off"
        cardTitle: "無廣告 & 開源"
        cardDescription: "享受不間斷的聆聽體驗。MusicFree 完全免費、開源，且永遠不會有廣告。"
      - sectionName: "FeaturePrivacy"
        sectionSummary: "專注於隱私的關鍵優勢，向使用者保證他們的資料將保持在本機且安全。"
        iconName: "lucide:lock"
        cardTitle: "您的資料，由您掌握"
        cardDescription: "您的所有資料、播放清單和設定都儲存在您的裝置本機。我們不收集您的任何個人資訊。"
      - sectionName: "FeatureLyrics"
        sectionSummary: "詳細介紹獨特的歌詞關聯功能，這對於音樂愛好者來說是一個很酷且實用的工具。"
        iconName: "lucide:music-4"
        cardTitle: "歌詞關聯"
        cardDescription: "將一首歌的歌詞連結到另一首歌。非常適合翻唱、混音，或當您在其他地方找到更好的歌詞時使用。"
      - sectionName: "FeatureDesktop"
        sectionSummary: "告知使用者有關桌面版本的資訊，擴展應用程式的生態系統和實用性。"
        iconName: "lucide:laptop"
        cardTitle: "也有桌面版！"
        cardDescription: "喜歡手機上的 MusicFree 嗎？在您的桌機上也能獲得同樣出色的體驗。快到 GitHub 上查看 MusicFreeDesktop。"
  - sectionName: "HowToInstallPlugins"
    sectionSummary: "一個清晰、以行動為導向的區塊，旨在簡化插件安裝過程。它提供簡單的說明和詳細指南的直接連結，讓新使用者能立即上手。"
    featureSectionTitle: "數秒內即可開始"
    featureSectionDescription: "安裝插件輕而易舉。前往「設定」，點擊「從網路安裝插件」，然後貼上插件儲存庫的 URL。您馬上就能開始聽音樂了！"
    featureSectionAction:
      text: "查看完整指南"
      link: "https://musicfree.catcat.work/usage/mobile/install-plugin.html"
    featureSectionBottomImage: "https://placehold.co/1440x700?text=Plugin+Installation+Screen"
  - sectionName: "AppScreenshots"
    sectionSummary: "一個引人入勝的 MusicFree 使用者介面圖庫。本區塊使用兩欄式網格來展示應用程式乾淨直觀的設計，讓潛在使用者在下載前能感受到其體驗。"
    twoColumnGridTitle: "實際操作畫面"
    list:
      - sectionName: "ScreenshotMain"
        sectionSummary: "展示主介面，突顯其乾淨的導覽和友善的使用者佈局。"
        contentCardTitle: "簡潔的主介面"
        contentCardDescription: "透過乾淨、直覺的設計輕鬆導覽您的音樂，將您的音樂庫置於中心位置。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Main+Interface"
      - sectionName: "ScreenshotPlayer"
        sectionSummary: "突顯沉浸式的播放器畫面，專注於音樂體驗。"
        contentCardTitle: "沉浸式播放器"
        contentCardDescription: "透過精美的全螢幕播放器專注於音樂，時尚地展示專輯封面。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Player+Page"
      - sectionName: "ScreenshotLyrics"
        sectionSummary: "顯示歌詞頁面以展示同步歌詞功能。"
        contentCardTitle: "同步歌詞"
        contentCardDescription: "跟著完美同步的歌詞一起唱，歌詞會隨著歌曲播放而滾動。不錯過任何一個節拍！"
        contentCardBottomImage: "https://placehold.co/800x450?text=Lyrics+Page"
      - sectionName: "ScreenshotPlaylist"
        sectionSummary: "顯示播放清單管理畫面以強調其組織功能。"
        contentCardTitle: "井然有序的播放清單"
        contentCardDescription: "輕鬆管理您的播放清單，在其中搜尋特定曲目，並讓您的音樂收藏保持整潔。"
        contentCardBottomImage: "https://placehold.co/800x450?text=Playlist+Page"
  - sectionName: "Faq"
    sectionSummary: "一個實用的常見問題區塊，主動回答使用者的常見疑問。透過易於閱讀的折疊式格式，解決關於費用、音樂來源、安全性及平台支援等潛在問題，藉此建立使用者信心。"
    faqTitle: "常見問題"
    faqList:
      - question: "MusicFree 真的免費嗎？"
        answer: "是的！這是一個開源專案，將永遠免費且無廣告。如果您看到付費版本，它們是假的，應立即回報。"
      - question: "音樂從哪裡來？"
        answer: "MusicFree 本身不提供任何音樂。所有歌曲都來自您選擇安裝的插件，這些插件會連接到網路上的各種來源。"
      - question: "使用插件安全嗎？"
        answer: "來自我們官方儲存庫的插件是安全的。如果您使用第三方插件，請自行驗證其安全性。我們對惡意插件造成的問題概不負責。"
      - question: "如何取得插件？"
        answer: "很簡單！您可以直接在應用程式的設定中，透過網路 URL 進行安裝。我們提供了一個官方插件儲存庫，幫助您快速上手。請查看我們的網站以獲取連結和詳細步驟指南！"
      - question: "支援哪些平台？"
        answer: "目前，MusicFree 適用於 Android 和 Harmony OS。我們在 GitHub 上還有一個獨立的桌面版本供您試用！"
  - sectionName: "FinalCta"
    sectionSummary: "最後一個充滿活力的行動呼籲，激勵使用者下載應用程式。它總結了核心優點，並提供醒目的按鈕，讓下一步的行動變得無法抗拒。"
    ctaTitle: "準備好掌控您的音樂了嗎？"
    ctaDescription: "立即下載 MusicFree，體驗真正開放、可自訂且無廣告的音樂播放器。加入社群，解放您的音樂！"
    cta:
      - text: "下載 Android 版"
        link: "https://github.com/maotoumao/MusicFree/releases"
      - text: "在 GitHub 上探索"
        link: "https://github.com/maotoumao/MusicFree"