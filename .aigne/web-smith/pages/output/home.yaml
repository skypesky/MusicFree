      properties:
        4221qi1bxy322mf4:
          value:
            - title: Is MusicFree really free?
              answer: Yes! It's an open-source project and will always be free and ad-free. If
                you see paid versions, they are fake and should be reported
                immediately.
            - title: Where does the music come from?
              answer: MusicFree itself doesn't provide any music. All songs come from the
                plugins you choose to install, which connect to various sources
                on the internet.
            - title: Are plugins safe to use?
              answer: Plugins from our official repository are safe. If you use third-party
                plugins, please verify their security yourself. We are not
                responsible for issues caused by malicious plugins.
            - title: How do I get plugins?
              answer: It's easy! You can install them from a network URL directly in the app's
                settings. We provide an official plugin repository to get you
                started. Check our website for the link and a step-by-step
                guide!
            - title: What platforms are supported?
              answer: Currently, MusicFree is available for Android and Harmony OS. We also
                have a separate desktop version available on GitHub for you to
                try!
            - title: ""
              answer: ""
