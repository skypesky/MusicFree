  3fa80e04dcc3dd645437683e2706b8b34dd4cbf6cc051152ced042234dd5c940:
    path: ../../../.imgs/main.jpg
    description: This screenshot displays a mobile music player application in a
      dark theme, specifically showing the "Favorites" section. It features a
      list of three playlists with album art, titles (e.g., "周杰伦" - Jay Chou),
      and song counts, accompanied by options to add or delete playlists. A
      search bar is visible at the top, along with navigation tabs for local
      music and downloads, and a mini-player at the bottom indicates a song is
      currently playing.
