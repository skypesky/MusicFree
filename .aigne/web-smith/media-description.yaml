  93ac4ef843a5a6efe021926b5648f2b4e98e4c1d903a65338212f5148d5467c2:
    path: ../../../.imgs/theme-setting.jpg
    description: A mobile application screenshot displays the "Theme Settings"
      interface in a dark mode, featuring various customization options. Users
      can toggle "Dark Mode" on/off with a pink switch, select a background
      image (one showing a mountain landscape at night is active), and fine-tune
      its appearance with "Blur" and "Transparency" adjustment sliders. All
      interface elements and text are presented in Chinese.
