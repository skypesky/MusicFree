  376a0131966caaa4d7d13fdba25ed368bd09ce508794c64a7fe9f1ef4c5ec4a8:
    path: ../../../.imgs/song-lrc.jpg
    description: This image is a mobile phone screenshot showcasing a music player
      application displaying song lyrics. The screen features Chinese lyrics
      centrally aligned against a blurred gradient background, with the
      currently playing line highlighted. Standard media playback controls,
      including a progress bar, pause button, and shuffle option, are visible at
      the bottom of the interface.
    generatedAt: 2025-10-20T08:17:34.231Z
  d96d9d3f7b0e07ea1486db581f83b058856eeba1bee96f4dd92aaad466478a3c:
    path: ../../../.imgs/song-sheet.jpg
    description: This image is a screenshot of a mobile application interface
      displaying a song playlist in a dark theme. The screen features a "Song
      Sheet" header, a prominent section for "我喜欢" (I like) with 40 songs and an
      associated album art thumbnail, and a scrollable list of numbered song
      entries. Each song entry includes a title, artist/source, and a "bilibili"
      tag, with a persistent player bar at the bottom showing a 4K Ultra HD icon
      and playback controls.
    generatedAt: 2025-10-20T08:17:34.231Z
  b0bc0a9498b58dc8361cf9ca1fd53d1f66339895a6983ac3ee96af4bb08b3e4f:
    path: ../../../.imgs/theme-setting-v0.6.jpg
    description: This is a mobile phone screenshot displaying a "Theme Settings"
      interface with various options for customizing the app's appearance. The
      screen shows choices for "Light Mode," "Dark Mode," and "Custom
      Background," with the custom background (a night sky scene) currently
      selected and applied as the blurred background of the settings page. A
      toggle for "Follow system dark settings" is also visible at the top.
    generatedAt: 2025-10-20T08:17:34.231Z
  a4eea86de39911848e8dd5b842ff91a70e908bd0b1426f0c97d9a1ce50cc5817:
    path: ../../../.imgs/song-cover.jpg
    description: This is a full-screen mobile phone screenshot depicting a video
      player interface. The central focus is a video thumbnail showing a bright
      blue sky with parts of two figures in white, overlaid with a prominent
      yellow "4K ULTRA HD" badge. Below the video, playback controls include a
      progress bar, current and total time, play/pause, skip, shuffle, like, and
      download options, while the top displays the video title and platform
      details.
    generatedAt: 2025-10-20T08:17:34.231Z
  cefe41ff9056a2509f6d1d683ff2f1f5807ad439f2dea1709cbfb90c782c2a82:
    path: ../../../.imgs/song-lrc-v0.6.jpg
    description: This image is a screenshot of a mobile music player interface,
      showcasing synchronized lyrics in a dark mode theme. The screen displays
      Chinese lyrics with the currently playing line highlighted in blue, along
      with the song title, artist, and source (Bilibili). Standard music
      playback controls are visible at the bottom, including a progress bar
      showing the current timestamp (02:51) against the total duration (04:30),
      play/pause, skip, shuffle, and playlist options.
    generatedAt: 2025-10-20T08:17:34.231Z
  7a4c885b946c25938d6cded1f252d0aa0962616b6c0597876a8c80ae8b4d639d:
    path: ../../../.imgs/sidebar-v0.6.jpg
    description: This image is a screenshot of a mobile application's sidebar menu,
      identified as "MusicFree," presented in a dark theme with white text and
      icons. The menu categorizes various settings and options, including basic
      settings, plugin and theme management, backup, permission control,
      language selection (showing Simplified Chinese), and software updates with
      the current version displayed as 0.6.0-alpha.0. The left-aligned menu
      offers comprehensive app configuration, partially revealing the main
      content area on the right.
